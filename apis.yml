description: 'iceonline (冰场联盟) operates an enterprise-grade backend management platform for
  ice rinks in China, published at www.iceonline.cn as a login-gated single-page administrative
  console branded "冰场联盟 企业级后台管理系统" (Ice Rink Alliance Enterprise Management System). The company
  was surfaced as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network as a lead for enrichment. As of this enrichment pass the public surface is a private
  SPA with no discoverable API: no OpenAPI/Swagger, SDK, developer portal, changelog, or security.txt
  was found — every probed path (including /.well-known/*, /swagger.json, /openapi.json) returns
  the SPA shell rather than a real document. Only live domain-security posture (TLS/DNS) could be
  captured this round.'
